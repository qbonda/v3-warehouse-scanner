
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>V3 倉儲 QR Code 掃描</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #f3f6fa;
      font-family: Arial, sans-serif;
      color: #17324d;
    }
    h2 { text-align: center; }
    button {
      width: 100%;
      padding: 15px;
      margin: 6px 0;
      font-size: 18px;
      border: 0;
      border-radius: 10px;
      background: #15375a;
      color: white;
    }
    #stop { background: #777; }
    #cameraBox {
      position: relative;
      margin-top: 15px;
    }
    video {
      width: 100%;
      display: block;
      background: #111;
      border-radius: 12px;
    }
    #scanFrame {
      position: absolute;
      left: 20%;
      top: 20%;
      width: 60%;
      height: 60%;
      border: 3px solid #35e59b;
      border-radius: 15px;
      box-sizing: border-box;
      pointer-events: none;
    }
    #result {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }
    #history {
      padding-left: 22px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h2>V3 倉儲 QR Code 掃描</h2>

  <button id="start">啟動掃描</button>
  <button id="stop">關閉掃描</button>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <div id="scanFrame"></div>
  </div>

  <div id="result">等待啟動掃描...</div>

  <h3>掃描紀錄（僅此頁面）</h3>
  <ol id="history"></ol>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    let stream = null;
    let running = false;
    let animationId = null;
    let lastCode = '';
    let lastTime = 0;

    const video = document.getElementById('video');
    const result = document.getElementById('result');
    const history = document.getElementById('history');

    const canvas = document.createElement('canvas');
    const context = canvas.getContext(
      '2d', { willReadFrequently: true }
    );

    function stopScanner() {
      running = false;

      if (animationId !== null) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;
    }

    function scanFrame() {
      if (!running) return;

      if (
        video.readyState >= 2 &&
        video.videoWidth > 0 &&
        video.videoHeight > 0 &&
        typeof jsQR === 'function'
      ) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        context.drawImage(
          video, 0, 0,
          canvas.width, canvas.height
        );

        const image = context.getImageData(
          0, 0, canvas.width, canvas.height
        );

        const code = jsQR(
          image.data,
          image.width,
          image.height,
          { inversionAttempts: 'attemptBoth' }
        );

        if (code && code.data) {
          const now = Date.now();

          if (
            code.data !== lastCode ||
            now - lastTime > 3000
          ) {
            lastCode = code.data;
            lastTime = now;

            result.textContent =
              '掃描成功：' + code.data;

            const item = document.createElement('li');
            item.textContent = code.data;
            history.prepend(item);

            if (navigator.vibrate) {
              navigator.vibrate(100);
            }
          }
        }
      }

      animationId = requestAnimationFrame(scanFrame);
    }

    document.getElementById('start').onclick =
      async () => {
        stopScanner();

        result.textContent = '正在啟動相機...';

        try {
          if (typeof jsQR !== 'function') {
            throw new Error(
              'QR 辨識程式載入失敗，請檢查網路'
            );
          }

          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error('瀏覽器不支援相機');
          }

          stream = await navigator.mediaDevices
            .getUserMedia({
              audio: false,
              video: {
                facingMode: { ideal: 'environment' }
              }
            });

          video.srcObject = stream;
          await video.play();

          running = true;
          result.textContent =
            '相機已啟動，請對準 QR Code';

          scanFrame();

        } catch (error) {
          stopScanner();
          result.textContent =
            '啟動失敗：' +
            error.name + ' ' + error.message;
        }
      };

    document.getElementById('stop').onclick = () => {
      stopScanner();
      result.textContent = '掃描已關閉';
    };

    window.addEventListener(
      'pagehide', stopScanner
    );
  </script>
</body>
</html>
