<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V3 倉儲 QR Code 掃描</title>
  <style>
    body { margin:0; padding:20px; background:#f3f6fa; font-family:Arial,sans-serif; color:#17324d; }
    h2 { text-align:center; }
    button, .action { display:block; width:100%; box-sizing:border-box; padding:15px; margin:8px 0; font-size:18px; border:0; border-radius:10px; background:#15375a; color:white; text-align:center; text-decoration:none; }
    #stop { background:#777; }
    #cameraBox { position:relative; margin-top:15px; }
    video { width:100%; display:block; background:#111; border-radius:12px; }
    #scanFrame { position:absolute; left:20%; top:20%; width:60%; height:60%; border:3px solid #35e59b; border-radius:15px; box-sizing:border-box; pointer-events:none; }
    #result { background:white; padding:15px; margin-top:15px; border-radius:10px; overflow-wrap:anywhere; }
    #history { padding-left:22px; overflow-wrap:anywhere; }
    #openV3 { background:#087a55; }
    [hidden] { display:none !important; }
    .hint { font-size:13px; color:#586c80; }
  </style>
</head>
<body>
  <h2>V3 倉儲 QR Code 掃描</h2>
  <button id="start" type="button">啟動掃描</button>
  <button id="stop" type="button">關閉掃描</button>
  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
    <div id="scanFrame"></div>
  </div>
  <div id="result" role="status" aria-live="polite">等待啟動掃描...</div>
  <a id="openV3" class="action" href="#" hidden>開啟 V3 儲位明細</a>
  <p class="hint">請確認掃描到正確儲位，再點擊綠色按鈕。掃描器不會傳送登入憑證。</p>
  <h3>掃描紀錄（僅此頁面）</h3>
  <ol id="history"></ol>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    'use strict';
    const V3_URL = 'https://script.google.com/macros/s/AKfycbzDYbdlzOpzvXa42JCCwibMZuiEJN02Xt39yndZNggKUECOfBr9yER6rUI1dYfGTUI36Q/exec';
    let stream = null, running = false, animationId = null;
    let lastCode = '', lastTime = 0;
    const video = document.getElementById('video');
    const result = document.getElementById('result');
    const history = document.getElementById('history');
    const openV3 = document.getElementById('openV3');
    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d', { willReadFrequently:true });

    function stopScanner() {
      running = false;
      if (animationId !== null) { cancelAnimationFrame(animationId); animationId = null; }
      if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
      video.srcObject = null;
    }
    function resetSelection() {
      openV3.hidden = true;
      openV3.removeAttribute('href');
      lastCode = '';
      lastTime = 0;
    }
    function parseSlot(raw) {
      let value = String(raw || '').trim();
      // 支援純儲位代碼，也支援 ?location= 或 ?slot= 的儲位網址。
      if (/^https?:\/\//i.test(value)) {
        try {
          const u = new URL(value);
          value = u.searchParams.get('location') || u.searchParams.get('slot') || '';
        } catch (_) { return ''; }
      }
      // 儲位代碼採保守驗證：英數、底線、連字號；不接受任意網址或指令。
      if (!/^[A-Za-z][A-Za-z0-9_-]{1,39}$/.test(value)) return '';
      return value.toUpperCase();
    }
    function acceptCode(raw) {
      const slot = parseSlot(raw);
      if (!slot) {
        result.textContent = '已辨識 QR Code，但內容不是有效的儲位編號：' + String(raw).slice(0, 120);
        resetSelection();
        return;
      }
      stopScanner(); // 避免連續掃描造成重複開啟
      result.textContent = '掃描成功：' + slot;
      const item = document.createElement('li');
      item.textContent = slot;
      history.prepend(item);
      openV3.href = V3_URL + '?location=' + encodeURIComponent(slot);
      openV3.hidden = false;
      if (navigator.vibrate) navigator.vibrate(100);
    }
    function scanFrame() {
      if (!running) return;
      if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0 && typeof jsQR === 'function') {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const image = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(image.data, image.width, image.height, { inversionAttempts:'attemptBoth' });
        if (code && code.data) {
          const now = Date.now();
          if (code.data !== lastCode || now - lastTime > 3000) {
            lastCode = code.data; lastTime = now;
            acceptCode(code.data);
            return;
          }
        }
      }
      animationId = requestAnimationFrame(scanFrame);
    }
    document.getElementById('start').onclick = async () => {
      stopScanner(); resetSelection();
      result.textContent = '正在啟動相機...';
      try {
        if (typeof jsQR !== 'function') throw new Error('QR 辨識程式載入失敗，請檢查網路');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('瀏覽器不支援相機');
        stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ ideal:'environment' } } });
        video.srcObject = stream;
        await video.play();
        running = true;
        result.textContent = '相機已啟動，請對準 QR Code';
        scanFrame();
      } catch (error) {
        stopScanner();
        result.textContent = '啟動失敗：' + error.name + ' ' + error.message;
      }
    };
    document.getElementById('stop').onclick = () => {
      stopScanner(); result.textContent = '掃描已關閉';
    };
    window.addEventListener('pagehide', stopScanner);
  </script>
</body>
</html>
